[project]
name = "poseforge"
version = "0.3.0"
description = "Pose estimation guided by a biomechanical model."
authors = [
    { name = "Sibo Wang-Chen", email = "sibo.wang@epfl.ch" }
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.0,<3",
    "scipy>=1.16.1,<2",
    "pandas>=2.3,<3",
    "matplotlib>=3.10,<4",
    "torch==2.9.*",  # specific version required by torchvision and torchcodec!
    "torchvision==0.24.*",  # specific to torch 2.9
    "torchcodec==0.8.*",  # specific to torch 2.9
    "tensorboard>=2.19,<3",
    "pillow>=11.3,<12",
    "tqdm>=4.67,<5",
    # "flygym>=1.2.1,<2",  # TODO: make it compatible with python 3.13
    # "dm_control==1.0.27",  # TODO: flygym requires one specific version of dm_control- make sure they match!
    "tyro>=1,<2",
    "wandb==0.21.1",
    "packaging>=25.0,<26",
    "imageio>=2.37.0,<3",
    "imageio-ffmpeg==0.6.0",
    "joblib>=1.5.1,<2",
    "distinctipy>=1.3.4,<2",
    "psutil>=7.0.0,<8",
    "seaborn==0.13.2",
    "pyvista==0.46.3",
    "pytest>=8.4.2,<9",
    "h5py>=3.14,<4",
    "scikit-learn>=1.7.2,<2",
    "PyYAML>=6.0.3,<7",
    "cmasher>=1.3.3,<2",
    "torchsummary>=1.5.1,<2",
    "imagecodecs==2025.8.2",
    "opencv-python>=4.5,<5",
    "filelock>=3.20.0,<4",
    "av<16",  # imageio depends on pyav but no pyav 16.0.0 wheel is available for my hardware yet
    "loguru==0.7.*",
    "parallel-video-io==0.1.5",
    "parallel-matplotlib-animation==0.1.2",
    "seqikpy==1.1.0",
    "spotlight-tools",
    # The following should be installed manually:
    # flygym & dm_control
    # seqikpy
    # contrastive-unpaired-translation
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poseforge"]

[tool.uv.sources]
spotlight-tools = { git = "https://github.com/NeLy-EPFL/spotlight-tools", tag = "snapshot20260521b" }
