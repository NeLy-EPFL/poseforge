# Shading geometry prior.
#
# Every body part is given the SAME uniform matte albedo with no texture, so the
# rendered RGB intensity reflects only the scene lighting and surface geometry
# (a Lambertian shading pass), not per-part color or texture. This is rendered
# through the ordinary color-coding renderer loop like any other visual set; it
# is the "shading" geometry buffer. Specular and shininess are set to 0 to keep
# the pass diffuse. Wings are kept opaque here (unlike the base/grayscale sets)
# so the shading buffer carries their geometry too.

shading_wing:
  apply_to: '*_wing'
  material:
    specular: 0.0
    shininess: 0.0
    rgba: [0.6, 0.6, 0.6, 1]
shading_eye:
  apply_to: '*_eye'
  material:
    specular: 0.0
    shininess: 0.0
    rgba: [0.6, 0.6, 0.6, 1]
