# v2: 3-class flip/invalid detector. Class 0 = not_flipped (keep); classes 1
# (flipped) and 2 (invalid: off-field / tracking failure) are both excluded.
# A frame is kept iff P(not_flipped) >= keep_threshold. See flip_detector_v12/README.md.
flip_detection:
  checkpoint: "~/poseforge/production_models/flip_detection/v2/flip_detector_v12_3class.pth"
  working_size: 224
  init_params:
    input_channels: 1
    num_classes: 3
  output_labels: ["not_flipped", "flipped", "invalid"]
  keep_threshold: 0.6

rearing_detection:
  checkpoint: "~/poseforge/production_models/rearing_detection/v1/production_checkpoint_v1.pth"
  input_size: 160
  crop_half: 130
  crop_y_offset: -60
  output_labels: ["not_rearing", "rearing"]

edge_detection:
  # Keypoint-independent corner method (poseforge.spotlight.valid_frame_filtering):
  # flag a frame if any aligned-frame corner is within this many mm of a wall.
  clearance_mm: 0.4

temporal_flip_filter:
  min_run: 3
  pad_seconds: 0.3

bodyseg:
  checkpoint: "~/poseforge/production_models/bodyseg/v2/production_checkpoint.model.pth"
  architecture_config: "~/poseforge/production_models/bodyseg/v2/configs/model_architecture_config.yaml"
  working_size: 256
  n_classes: 29
  output_labels: [
    "Background", "OtherSegments", "Thorax",
    "LFCoxa", "LFFemur", "LFTibia", "LFTarsus",
    "LMCoxa", "LMFemur", "LMTibia", "LMTarsus",
    "LHCoxa", "LHFemur", "LHTibia", "LHTarsus",
    "RFCoxa", "RFFemur", "RFTibia", "RFTarsus",
    "RMCoxa", "RMFemur", "RMTibia", "RMTarsus",
    "RHCoxa", "RHFemur", "RHTibia", "RHTarsus",
    "LAntenna", "RAntenna"
  ]

keypoints3d:
  checkpoint: "~/poseforge/production_models/keypoints3d/v2/production_checkpoint.model.pth"
  architecture_config: "~/poseforge/production_models/keypoints3d/v2/configs/model_architecture_config.yaml"
  working_size: 256
  n_keypoints: -1
  keypoint_names: [
    "LFThC", "LFCTr", "LFFTi", "LFTiTa", "LFClaw",
    "LMThC", "LMCTr", "LMFTi", "LMTiTa", "LMClaw",
    "LHThC", "LHCTr", "LHFTi", "LHTiTa", "LHClaw",
    "RFThC", "RFCTr", "RFFTi", "RFTiTa", "RFClaw",
    "RMThC", "RMCTr", "RMFTi", "RMTiTa", "RMClaw",
    "RHThC", "RHCTr", "RHFTi", "RHTiTa", "RHClaw",
    "LPedicel", "RPedicel"
  ]
